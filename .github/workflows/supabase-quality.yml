name: Calidad Supabase
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sql-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Iniciar entorno efímero local
        run: npx --yes supabase@3.1.0 start -x studio,imgproxy,realtime,logflare,vector,supavisor,edge-runtime,postgres-meta > /tmp/nido-start.log 2>&1
      - name: Ejecutar contratos SQL y RLS con roles de cliente
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidencias/ejecuciones/sql
          git rev-parse HEAD > evidencias/ejecuciones/sql/commit.txt
          date -u --iso-8601=seconds > evidencias/ejecuciones/sql/inicio.txt
          npx --yes supabase@3.1.0 test db 2>&1 | tee evidencias/ejecuciones/sql/pgtap.log
      - name: Auth real y revocación de sesión por HTTP local
        run: python scripts/test_auth_local.py > evidencias/ejecuciones/sql/auth-http.json
      - name: Pruebas de autorización del handler Edge
        run: node --test supabase/functions/lookup-user/handler.test.mjs > evidencias/ejecuciones/sql/edge-handler.log
      - name: Iniciar runtime Edge local
        run: npx --yes supabase@3.1.0 functions serve lookup-user > /tmp/nido-edge.log 2>&1 &
      - name: Invitaciones y Edge con tres cuentas reales de pruebas
        run: python scripts/test_family_local.py > evidencias/ejecuciones/sql/family-http.json
      - name: Último administrador con conexiones simultáneas
        run: python scripts/test_membership_concurrency.py > evidencias/ejecuciones/sql/membership-concurrency.json
      - name: Ciclos de ascendencia con conexiones simultáneas
        run: python scripts/test_relationship_concurrency.py > evidencias/ejecuciones/sql/relationship-concurrency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-sqa-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/ejecuciones/sql/
          retention-days: 30
      - name: Detener entorno de pruebas
        if: always()
        run: npx --yes supabase@3.1.0 stop
