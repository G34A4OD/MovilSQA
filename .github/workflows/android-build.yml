name: Compilar Android
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Compilar la aplicación conectada con configuración ficticia
        working-directory: app
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_synthetic_not_a_credential
      - name: Registrar commit y checksum
        run: |
          mkdir -p evidencias/ejecuciones/android-build
          git rev-parse HEAD > evidencias/ejecuciones/android-build/commit.txt
          sha256sum app/build/app/outputs/flutter-apk/app-debug.apk > evidencias/ejecuciones/android-build/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            evidencias/ejecuciones/android-build/
          retention-days: 14
